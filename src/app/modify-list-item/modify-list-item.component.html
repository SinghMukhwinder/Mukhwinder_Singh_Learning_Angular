<form [formGroup]="smartphoneForm" (ngSubmit)="onSubmit()">

  <div class="form-group">
    <label for="id">Id:</label>
    <input type="number" id="id" formControlName="id" [appHighlightOnFocus]="'lightyellow'"/>
  </div>

  <div class="form-group">
    <label for="serialNumber">Serial Number:</label>
    <input type="text" id="serialNumber" formControlName="serialNumber" [appHighlightOnFocus]="'lightyellow'"/>
  </div>

  <div class="form-group">
    <label for="brand">Brand:</label>
    <input type="text" id="brand" formControlName="brand" [appHighlightOnFocus]="'lightyellow'"/>
  </div>

  <div class="form-group">
    <label for="storage">Storage:</label>
    <input type="number" id="storage" formControlName="storage" [appHighlightOnFocus]="'lightyellow'"/>
  </div>

  <div class="form-group">
    <label for="releaseDate">Release Date:</label>
    <input type="date" id="releaseDate" formControlName="releaseDate" [appHighlightOnFocus]="'lightyellow'"/>
  </div>

  <div class="form-group">
    <label for="price">Price:</label>
    <input type="number" id="price" formControlName="price" [appHighlightOnFocus]="'lightyellow'"/>
  </div>

  <div class="form-group">
    <label for="isAvailable">Is Available:</label>
    <input type="checkbox" id="isAvailable" formControlName="isAvailable"/>
  </div>

  <div class="form-group">
    <label for="image">Is Available:</label>
    <input type="file" id="image" formControlName="Image"/>
  </div>

  <button type="submit" [appHoverHighlight]="'lightblue'">Submit</button>
</form>
<div *ngIf="error" class="error">{{ error }}</div>
